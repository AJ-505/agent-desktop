name: e2e-runsh
on:
  push:
    branches: [probe/413]
    paths: ['.github/workflows/e2e-runsh.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runsh:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            ref: b43ac4f6e892ef608f8851428613c4009f0e84c7
          - label: fix
            ref: 70657f326b40a71bc5f6220cd07ddd958a602149
    name: run.sh (${{ matrix.label }})
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: AJ-505/agent-desktop
          ref: ${{ matrix.ref }}
          path: repo
      - name: Toolchain
        working-directory: repo
        run: |
          sw_vers
          git log --oneline -1
          rustup show
      - name: Give the desktop one focused window
        run: |
          osascript -e 'tell application "TextEdit" to make new document' -e 'tell application "TextEdit" to activate'
          sleep 2
          osascript -e 'tell application "System Events" to get name of first application process whose frontmost is true'
      - name: Run tests/e2e/run.sh
        working-directory: repo
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/out"
          AGENT_DESKTOP_E2E_EXCLUSIVE=1 bash tests/e2e/run.sh 2>&1 | tee "$RUNNER_TEMP/out/run.log"
          echo "exit=$?" | tee -a "$RUNNER_TEMP/out/run.log"
      - name: Collect
        if: always()
        run: |
          screencapture -x "$RUNNER_TEMP/out/final.png" || true
          for d in /tmp/ad-*; do [ -d "$d" ] && tar -czf "$RUNNER_TEMP/out/$(basename "$d").tgz" -C /tmp "$(basename "$d")" --exclude='*.app' --exclude='bin' || true; done
          ls -la "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runsh-${{ matrix.label }}
          path: ${{ runner.temp }}/out
          retention-days: 7
