name: probe413
on:
  push:
    branches: [probe/413]
    paths: ['.github/workflows/probe413.yml', 'probe413/observer.swift', 'probe413/poster.swift', 'probe413/e2e.sh']
permissions:
  contents: read
jobs:
  e2e:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          repository: AJ-505/agent-desktop
          ref: b43ac4f6e892ef608f8851428613c4009f0e84c7
          path: base
      - uses: actions/checkout@v4
        with:
          repository: AJ-505/agent-desktop
          ref: fix/413-sided-modifiers
          path: fix
      - name: Build base and fix binaries
        run: |
          sw_vers
          (cd base && cargo build --release --locked -p agent-desktop) && cp target/release/agent-desktop agent-desktop-base
          (cd fix && git log --oneline -1 && cargo build --release --locked -p agent-desktop) && cp target/release/agent-desktop agent-desktop-fix
          ls -la agent-desktop-base agent-desktop-fix
      - name: Build observer
        run: |
          cd harness/probe413
          swiftc -O observer.swift -o observer
          swiftc -O poster.swift -o poster
      - name: Run E2E scenarios
        run: |
          cd harness/probe413
          ./e2e.sh "$GITHUB_WORKSPACE/agent-desktop-base" "$GITHUB_WORKSPACE/agent-desktop-fix" "$GITHUB_WORKSPACE/out"
          echo "===== observer log"
          cat "$GITHUB_WORKSPACE/out/observer.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e413
          path: out
